# Nginx reverse proxy with HTTPS for an app listening on 127.0.0.1:3000
#
# Install:
#   Ubuntu: sudo cp myapp.conf /etc/nginx/sites-available/myapp
#           sudo ln -s /etc/nginx/sites-available/myapp /etc/nginx/sites-enabled/
#   RHEL:   sudo cp myapp.conf /etc/nginx/conf.d/myapp.conf
#   Then:   sudo nginx -t && sudo systemctl reload nginx
#
# Replace example.com with your domain. Get the certificate with:
#   sudo certbot certonly --webroot -w /var/www/certbot -d example.com -d www.example.com

upstream myapp {
    server 127.0.0.1:3000;
    # server 127.0.0.1:3001;      # add more servers to load-balance
    keepalive 32;
}

# HTTP: answer Let's Encrypt challenges, send everything else to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    # nginx 1.25.1+ prefers "listen 443 ssl;" plus "http2 on;"
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;
    gzip_types text/plain text/css application/json application/javascript;

    access_log /var/log/nginx/myapp.access.log;
    error_log  /var/log/nginx/myapp.error.log;

    location / {
        proxy_pass http://myapp;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Serve static files directly, without the app
    location /static/ {
        alias /opt/myapp/current/static/;
        expires 7d;
    }

    location = /health {
        access_log off;
        proxy_pass http://myapp;
    }
}
