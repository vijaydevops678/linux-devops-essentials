# /etc/sysctl.d/99-devops.conf
# Kernel settings for busy web servers, container hosts and Kubernetes nodes.
# Apply with:  sudo cp 99-devops.conf /etc/sysctl.d/ && sudo sysctl --system
# Check one:   sysctl net.core.somaxconn
#
# Change only what you need, and measure before and after.
# Note: sysctl files do not allow comments at the end of a line.

# ---------- files ----------
# System-wide open file handles
fs.file-max = 2097152
# File watchers (IDEs, kubelet, log shippers)
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512

# ---------- network: busy servers and proxies ----------
# Accept queue per listening socket
net.core.somaxconn = 4096
# Half-open connections during traffic spikes
net.ipv4.tcp_max_syn_backlog = 8192
# More source ports for outgoing connections
net.ipv4.ip_local_port_range = 10240 65535
# Reuse TIME-WAIT sockets for new outgoing connections
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# ---------- memory ----------
# Prefer RAM over swap (databases, latency-sensitive apps)
vm.swappiness = 10
# Uncomment for Elasticsearch / OpenSearch
# vm.max_map_count = 262144

# ---------- containers and Kubernetes ----------
# The bridge settings need the module loaded first:
#   sudo modprobe br_netfilter overlay   (persist in /etc/modules-load.d/k8s.conf)
net.ipv4.ip_forward = 1
net.bridge.bridge-nf-call-iptables = 1
net.bridge.bridge-nf-call-ip6tables = 1
