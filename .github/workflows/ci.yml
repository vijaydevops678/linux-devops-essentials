name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: find . -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: ShellCheck (warnings and errors)
        run: |
          shellcheck --version
          find . -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning

  smoke-test:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Shell basics
        run: |
          ./01-shell-scripting-basics/bash-basics-demo.sh
          ./01-shell-scripting-basics/script-template.sh -n ci

      - name: Files, processes, users
        run: |
          ./02-files-and-directories/find-large-files.sh -n 5 .
          ./05-processes/process-monitor.sh -n 3
          ./04-users-and-groups/bulk-create-users.sh -n 04-users-and-groups/users.csv.example

      - name: Log analysis on the sample logs
        run: |
          ./09-text-processing-logs/log-analyzer.sh -n 5 09-text-processing-logs/sample-access.log
          ./12-security-hardening/failed-logins-report.sh -n 5 12-security-hardening/sample-auth.log

      - name: SSH check finds the problems in the sample config
        run: |
          set +e
          ./12-security-hardening/ssh-hardening-check.sh -f 12-security-hardening/sample-sshd_config
          test $? -eq 1

      - name: Backup and restore round trip
        run: |
          ./11-cron-scheduling/backup.sh -d /tmp/backups -k 7 -n ci 01-shell-scripting-basics
          cd /tmp/backups && sha256sum -c ./*.sha256
          mkdir -p /tmp/restore && tar -xzf ./ci-*.tar.gz -C /tmp/restore
          test -f /tmp/restore/01-shell-scripting-basics/script-template.sh

      - name: Deploy, auto-rollback and manual rollback
        working-directory: projects/03-app-deploy-with-rollback
        env:
          APP_DIR: /tmp/myapp
          HEALTH_URL: http://localhost:8080/health
          HEALTH_RETRIES: 2
        run: |
          mkdir -p /tmp/myapp
          python3 -m http.server 8080 --directory /tmp/myapp/current >/dev/null 2>&1 &
          sleep 1
          ./deploy.sh deploy sample-app/v1
          sleep 1
          ./deploy.sh deploy sample-app/v2
          curl -fs http://localhost:8080/ | grep -q "version 2"
          sleep 1
          if ./deploy.sh deploy sample-app/v3-broken; then echo "broken release should fail"; exit 1; fi
          curl -fs http://localhost:8080/ | grep -q "version 2"
          ./deploy.sh rollback
          curl -fs http://localhost:8080/ | grep -q "version 1"
          ./deploy.sh list

      - name: Server bootstrap (dry run)
        run: sudo ./projects/02-server-bootstrap/bootstrap.sh -n -u ci-admin -H ci-test -t UTC

  smoke-test-advanced:
    name: Smoke tests (topics 13-19)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Boot check finds the mistakes in the sample fstab
        run: |
          set +e
          ./13-boot-process/boot-health-check.sh -f 13-boot-process/sample-fstab
          test $? -eq 1

      - name: Performance snapshot
        run: ./14-performance/perf-snapshot.sh -i 2

      - name: Mini container is isolated
        working-directory: 15-linux-containers-internals
        run: |
          sudo ./mini-container.sh -H ci-box -- hostname | tee out.txt
          grep -qx ci-box out.txt
          test "$(hostname)" != ci-box
          sudo ./mini-container.sh -- ps aux | tee out.txt
          grep -qE '^root +1 .*ps aux' out.txt

      - name: Mini container memory limit triggers the OOM killer
        working-directory: 15-linux-containers-internals
        run: |
          if grep -qw memory /sys/fs/cgroup/cgroup.controllers; then
            set +e
            sudo timeout 60 ./mini-container.sh -m 50M -- tail /dev/zero
            test $? -eq 137
          else
            echo "memory controller not available on this runner, skipping"
          fi

      - name: Inspect the namespaces of a running container
        working-directory: 15-linux-containers-internals
        run: |
          sudo ./mini-container.sh -- sleep 20 > /dev/null 2>&1 &
          sleep 3
          pid=$(pgrep -n -x sleep)
          sudo ./inspect-namespaces.sh "$pid" "$$" | tee out.txt
          grep -qE '^ +pid .*ISOLATED' out.txt
          grep -qE '^ +net .*ISOLATED' out.txt

      - name: Certificate tools
        working-directory: /tmp
        run: |
          T=$GITHUB_WORKSPACE/16-nginx-and-tls
          $T/cert-tool.sh selfsigned localhost 90
          $T/cert-tool.sh match localhost.crt localhost.key
          $T/cert-tool.sh csr api.example.com
          $T/cert-tool.sh inspect api.example.com.csr
          openssl s_server -accept 8443 -cert localhost.crt -key localhost.key -quiet -www > /dev/null 2>&1 &
          sleep 1
          $T/ssl-expiry-check.sh localhost:8443 localhost.crt
          $T/cert-tool.sh chain localhost:8443

      - name: Nginx reverse proxy with HTTPS (end to end)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx
          sudo mkdir -p /etc/letsencrypt/live/example.com /var/www/certbot /opt/myapp/current/static
          (cd /tmp && "$GITHUB_WORKSPACE/16-nginx-and-tls/cert-tool.sh" selfsigned example.com 30)
          sudo cp /tmp/example.com.crt /etc/letsencrypt/live/example.com/fullchain.pem
          sudo cp /tmp/example.com.key /etc/letsencrypt/live/example.com/privkey.pem
          sudo cp $GITHUB_WORKSPACE/16-nginx-and-tls/nginx/myapp.conf /etc/nginx/conf.d/myapp.conf
          sudo nginx -t
          sudo systemctl restart nginx
          mkdir -p /tmp/app && echo ok > /tmp/app/health && echo "hello from the app" > /tmp/app/index.html
          python3 -m http.server 3000 --directory /tmp/app > /dev/null 2>&1 &
          sleep 1
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: example.com' http://localhost/)" = 301
          curl -sk --resolve example.com:443:127.0.0.1 https://example.com/ | grep -q "hello from the app"
          curl -sk --resolve example.com:443:127.0.0.1 -D - -o /dev/null https://example.com/health | grep -qi strict-transport-security
          ./16-nginx-and-tls/ssl-expiry-check.sh /etc/letsencrypt/live/example.com/fullchain.pem

      - name: Kernel and limits audit
        run: |
          set +e
          sudo ./17-kernel-tuning-limits/kernel-limits-audit.sh -k
          rc=$?
          test $rc -eq 0 -o $rc -eq 1
          set -e
          sudo modprobe br_netfilter
          sudo sysctl -p 17-kernel-tuning-limits/99-devops.conf
          test "$(sysctl -n net.ipv4.ip_forward)" = 1

      - name: Dotfiles install, load and uninstall
        run: |
          export HOME=$(mktemp -d)
          echo "# test bashrc" > "$HOME/.bashrc"
          ./18-environment-and-shell/install-dotfiles.sh
          ./18-environment-and-shell/install-dotfiles.sh
          test "$(grep -c '>>> devops-shell >>>' "$HOME/.bashrc")" -eq 1
          bash -ic 'type mkcd && alias k' 2>/dev/null
          ./18-environment-and-shell/install-dotfiles.sh -u
          ! grep -q devops-shell "$HOME/.bashrc"

      - name: PATH doctor catches a broken PATH
        run: |
          mkdir -p /tmp/ww && chmod 777 /tmp/ww
          set +e
          PATH="/usr/bin:/bin::relative:/tmp/ww" /usr/bin/bash ./18-environment-and-shell/path-doctor.sh -c bash
          test $? -eq 1

      - name: Triage report
        run: |
          set +e
          sudo ./19-troubleshooting-playbook/triage.sh -o /tmp/triage
          rc=$?
          test $rc -eq 0 -o $rc -eq 1
          sudo grep -q "RED FLAGS" /tmp/triage/triage-*.txt
